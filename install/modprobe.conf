# Prevent mt76x2u from claiming the Xbox Wireless Adapter (handled by xone_dongle).
blacklist mt76x2u

# xone_wired defaults to allow_vendors=045e,1038 to avoid hijacking third-party
# gamepads handled by xpad/hid. Override as needed, e.g. allow_vendors=all.
# options xone_wired allow_vendors=045e,1038
# options xone_wired deny_vendors=2dc8
